# Ce que la construction vérifie.
#
# L'application ne vise que macOS. Le noyau, lui, ne connaît aucun système : ce
# flux le compile et le fait tourner deux fois — une fois par le chemin
# d'Accelerate, une fois par le chemin en Swift pur — parce qu'une frontière qu'on
# ne mesure que d'un côté n'est qu'une promesse.

name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS — tout
    # macOS 26 : le paquet vise cette version depuis que l'interface est en
    # Liquid Glass. Un coureur plus ancien n'a pas le SDK qui la connaît.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Vérifications
        run: ./check.sh
      - name: Le chemin portable
        # Les mêmes contrôles, mais en forçant la couche numérique sur son
        # implémentation en Swift pur. C'est ce qui garde les deux implémentations
        # comparables : celle d'Accelerate n'est une référence que tant que l'autre
        # tourne sur les mêmes signaux.
        #
        # `FourierCheck` manque à l'appel : sa référence vient de PyTorch et n'est
        # pas versionnée (elle pèse, et se refabrique par `Tools/Fourier`). Elle
        # reste un contrôle local, que `check.sh` saute proprement si le fichier
        # n'est pas là.
        run: |
          swift build -c release -Xswiftc -DSPECTRE_PORTABLE
          BIN="$(swift build -c release -Xswiftc -DSPECTRE_PORTABLE --show-bin-path)"
          "$BIN/DSPCheck"
          "$BIN/WAVCheck"
          "$BIN/AnalysisCheck"
          "$BIN/PercussionCheck"
          "$BIN/HarmonyCheck"
