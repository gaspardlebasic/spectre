# Ce que la construction vérifie.
#
# Trois plateformes, et un partage du travail dicté par ce que la machine de
# développement sait faire. Le portage se mène depuis une machine Windows ARM64 :
# ce chemin-là est donc éprouvé à chaque compilation, à la main, et n'a pas besoin
# d'un coureur. Ce flux couvre exactement ce que cette machine ne peut pas juger —
# macOS, Windows en x64, et Linux.
#
# Le noyau ne connaît aucun système. On le compile et on le fait tourner par les
# deux chemins numériques — celui d'Accelerate et celui en Swift pur — parce
# qu'une frontière qu'on ne mesure que d'un côté n'est qu'une promesse.
#
# Le coureur Linux a longtemps dit « il n'existe pas encore de version Linux, et
# c'est justement en la préparant tous les jours qu'elle coûtera un pilote et non
# une application ». Elle existe depuis le portage, et ce coureur construit
# maintenant l'application entière — fenêtre, son, séparation comprises.

name: Vérification

# ─────────────────────────────────────────────────────────────────────────────
# QUAND CELA TOURNE, ET QUAND CELA NE TOURNE PAS
#
# Sur `main`, et nulle part ailleurs : **pousser sur une branche ne compile rien.**
# Le travail se fait donc par branches, qu'on fusionne de temps en temps, et une
# fusion vaut une compilation — au lieu d'une par commit. Ce que cela coûte est
# écrit dans AGENTS.md : la seule vérification automatique des trois plateformes
# arrive tard, et c'est aux épreuves locales de tenir l'intervalle.
#
# `workflow_dispatch` reste là pour cela : on peut lancer cette vérification sur une
# branche, à la demande, avant de fusionner — sans la subir à chaque commit.
#
# `paths-ignore` retire les poussées qui ne changent que de la documentation. Elles
# font près de la moitié des commits de ce dépôt, et ne vérifient rien : compiler
# trois plateformes pour un paragraphe réécrit est du bruit. Un commit qui touche à
# la fois un `.md` et du code compile, lui — le filtre ne saute que si *tout* ce qui
# a changé est de la documentation.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Resources/Captures/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Resources/Captures/**"
      - "LICENSE"
  workflow_dispatch:

# Deux fusions coup sur coup lançaient deux vérifications complètes qui se
# marchaient dessus, alors que seule la seconde dit quelque chose de vrai sur ce que
# `main` contient. La première est donc annulée.
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS — tout
    # macOS 26 : le paquet vise cette version depuis que l'interface est en
    # Liquid Glass. Un coureur plus ancien n'a pas le SDK qui la connaît.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Vérifications
        run: ./check.sh
      - name: L'épreuve, sans la fenêtre
        # Le morceau témoin de synthèse, et ce qu'on en tire sans écran : le tempo
        # relevé, la grille d'accords, le spectrogramme dessiné hors fenêtre. Le
        # coureur n'a pas de session graphique — l'application elle-même se juge à
        # la main, sur `build/essai/fenetre.png`. `--rapide` évite de repasser les
        # harnais que l'étape précédente vient de faire tourner.
        run: ./essai.sh --rapide --sans-fenetre
      - name: Le chemin portable
        # Les mêmes contrôles, mais en forçant la couche numérique sur son
        # implémentation en Swift pur. C'est ce qui garde les deux implémentations
        # comparables : celle d'Accelerate n'est une référence que tant que l'autre
        # tourne sur les mêmes signaux.
        #
        # `FourierCheck` manque à l'appel : sa référence vient de PyTorch et n'est
        # pas versionnée (elle pèse, et se refabrique par `Tools/Fourier`). Elle
        # reste un contrôle local, que `check.sh` saute proprement si le fichier
        # n'est pas là.
        run: |
          swift build -c release -Xswiftc -DSPECTRE_PORTABLE
          BIN="$(swift build -c release -Xswiftc -DSPECTRE_PORTABLE --show-bin-path)"
          "$BIN/DSPCheck"
          "$BIN/WAVCheck"
          "$BIN/SessionCheck"
          "$BIN/FilterCheck"
          "$BIN/ChainCheck"
          "$BIN/GaplessCheck"
          "$BIN/AnalysisCheck"
          "$BIN/PercussionCheck"
          "$BIN/HarmonyCheck"

  windows:
    name: Windows x64 — le noyau
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Le couple branche/étiquette se met à jour ensemble : l'action va chercher
      # une archive précise, et une paire dépareillée échoue au téléchargement
      # plutôt qu'à la compilation, ce qui égare.
      #
      # 6.3.3 et pas moins : la 6.0.3 échoue sur « cyclic dependency in module
      # 'ucrt' » avant même de lire le manifeste — un désaccord entre la chaîne et
      # le SDK Windows, qui n'a rien à voir avec ce dépôt.
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE

      - name: Version de la chaîne
        run: swift --version

      # `swift build` sans viser de cible : le manifeste est du code, exécuté sur
      # la machine qui construit, et il ne déclare tout simplement pas la couche
      # Apple ailleurs que sur un Mac. Viser une cible à la main ne marcherait pas
      # de toute façon — `--product` est sans effet sur une bibliothèque
      # automatique, SwiftPM prévient et construit tout.
      #
      # `SPECTRE_PORTABLE` n'est pas passé à la main : le manifeste le pose d'office
      # là où Accelerate n'existe pas.
      - name: Construire et vérifier le noyau
        shell: pwsh
        env:
          # Le cache des pistes séparées a un plafond : un harnais qui ne range pas
          # chez lui efface les pistes des vrais morceaux, et des minutes de GPU
          # avec elles. Sans objet sur un coureur neuf, mais la discipline vaut
          # partout — c'est en la relâchant « juste ici » qu'on la perd.
          SPECTRE_RANGEMENT: ${{ runner.temp }}/spectre
        run: |
          swift build -c release
          # `--show-bin-path` plutôt que `.build\release` : Windows refuse de créer
          # le lien symbolique qui porte ce nom hors du mode développeur, et la
          # construction le signale sans échouer. Le chemin réel porte le triplet.
          $bin = (swift build -c release --show-bin-path | Select-Object -Last 1).Trim()
          foreach ($harnais in @("DSPCheck", "WAVCheck", "SessionCheck", "FilterCheck",
                                 "ChainCheck", "GaplessCheck", "AnalysisCheck",
                                 "PercussionCheck", "HarmonyCheck")) {
            Write-Host "── $harnais"
            & "$bin\$harnais.exe"
            if ($LASTEXITCODE -ne 0) { throw "$harnais a échoué ($LASTEXITCODE)" }
          }

  linux:
    name: Linux — l'application
    runs-on: ubuntu-latest
    # La même version que la chaîne Windows : le portage se juge sur un désaccord
    # entre plateformes, pas sur un désaccord entre compilateurs.
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Version de la chaîne
        run: swift --version

      # Ce que l'application demande au système. La liste est celle de `machine.sh`,
      # amputée de ce qui ne sert qu'à un poste de travail — pas de bureau, pas de
      # polices, pas de Mesa complet : rien ici n'ouvre de fenêtre.
      #
      # Mais **pas amputée de ce que SDL exige à la configuration** : elle refuse de
      # se configurer si XScreenSaver ou XTest manquent, et le dit au bout de deux
      # minutes de tests réussis. Trois paquets de trop coûtent dix secondes ; trois
      # de moins coûtent une exécution entière.
      #
      # `file` est là pour `appimagetool`, et le greffon de libdecor pour que le
      # paquet porte une barre de titre. Un conteneur n'a ni l'un ni l'autre : la
      # machine de développement les avait, et c'est exactement le genre de
      # dépendance qu'on ne découvre que sur un coureur nu.
      - name: Les bibliothèques
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            file \
            libcairo2-dev libpango1.0-dev libasound2-dev \
            libsndfile1-dev libmpg123-dev libepoxy-dev libgl1-mesa-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libdecor-0-plugin-1-cairo \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev

      # La 24.04 ne livre que SDL2 : la 3 est sortie après le gel de cette LTS. La
      # version est celle de `machine.sh`, et les deux doivent rester d'accord — un
      # coureur qui construit une autre SDL que la machine de développement mesure
      # autre chose que ce qu'on livre.
      - name: SDL3
        run: |
          git clone --depth 1 --branch release-3.4.14 \
            https://github.com/libsdl-org/SDL /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DSDL_SHARED=ON
          cmake --build /tmp/SDL/build
          cmake --install /tmp/SDL/build
          ldconfig

      # C'est la ligne qui a changé de sens : ce n'est plus le noyau qui se compile,
      # c'est l'application. Un désaccord de plateforme se voit ici, pas trois
      # semaines plus tard sur la machine de quelqu'un.
      - name: Construire l'application
        run: swift build -c release

      # Tous les harnais qui n'ont besoin ni d'un périphérique audio ni d'un
      # contexte OpenGL — un coureur n'a ni l'un ni l'autre.
      #
      # `SortieCheck` et `RenduCheck` restent donc dehors, et c'est une vraie
      # lacune, pas un oubli : la sortie audio et le rendu sont mesurés à la main
      # sur la machine de développement, par `./essai.sh`. Les y faire entrer
      # demanderait un périphérique nul — qui draine aussi vite qu'il peut, et ne
      # dirait donc rien de la cadence — et un Xvfb avec un rendu logiciel, qui ne
      # dirait rien de la carte.
      - name: Les harnais hors écran
        env:
          SPECTRE_RANGEMENT: ${{ runner.temp }}/spectre
        run: |
          BIN="$(swift build -c release --show-bin-path)"
          for harnais in LangueCheck DSPCheck WAVCheck SessionCheck FilterCheck \
                         ChainCheck GaplessCheck AnalysisCheck PercussionCheck \
                         HarmonyCheck GestesCheck DecodeCheck PistesCheck; do
            echo "── $harnais"
            "$BIN/$harnais"
          done

      # L'AppImage se fabrique aussi, et pour la même raison que l'installeur sous
      # Windows : un paquet qui ne s'assemble qu'à la veille d'une livraison
      # s'assemble mal. On ne l'éprouve pas ici — il n'y a pas d'écran — mais on
      # sait qu'il se monte.
      - name: L'AppImage
        run: ./paquet.sh
