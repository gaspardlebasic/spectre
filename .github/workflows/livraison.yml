# Ce que la livraison fabrique, et où elle le pose.
#
# Deux coureurs Windows, un par architecture, et une release qui reçoit ce qu'ils
# produisent. On pousse une étiquette, et l'affaire est faite :
#
#     git tag v0.3 && git push origin v0.3
#
# `workflow_dispatch` fait la même chose sans étiquette, et sans rien publier : c'est
# ainsi qu'on éprouve ce fichier sans salir la page des releases.
#
# ─────────────────────────────────────────────────────────────────────────────
# POURQUOI DEUX COUREURS, ET PAS UNE COMPILATION CROISÉE
#
# Sur le Mac, `livraison.sh` produit **un** binaire qui porte les deux tranches :
# c'est ce que sait faire le format Mach-O, et personne d'autre ne le sait. Un
# exécutable Windows est d'une architecture et d'une seule, si bien qu'il faut deux
# fichiers, deux installeurs, et deux téléchargements distincts.
#
# Compiler l'ARM64 depuis une machine x64 serait possible en principe et personne ne
# l'éprouverait : `build.ps1` finit par lancer l'application dans un dossier propre,
# et ce contrôle-là — le seul qui dise que le paquet s'ouvre chez quelqu'un d'autre —
# ne peut se faire que sur la machine visée. Deux coureurs, donc, et chacun éprouve
# ce qu'il vient de produire. `windows-11-arm` est gratuit pour les dépôts publics.
#
# ─────────────────────────────────────────────────────────────────────────────
# WINDOWS POWERSHELL, ET DES ÉTAPES SANS UN SEUL ACCENT
#
# `shell: powershell` désigne Windows PowerShell 5.1 ; `pwsh`, qui est le défaut de
# GitHub, désigne PowerShell 7. Les scripts du dépôt sont écrits et éprouvés contre
# le premier — `Add-Type -AssemblyName System.Drawing`, dont `logo.ps1` a besoin, ne
# se charge pas de la même manière dans le second.
#
# **Et le corps des étapes ci-dessous ne porte donc aucun caractère accentué.** Le
# coureur écrit chaque `run:` dans un `.ps1` temporaire **sans marque d'ordre**, et
# Windows PowerShell lit alors le fichier dans la page de codes du système : un
# « — » de trois octets en devient trois caractères, et la chaîne qui le contenait ne
# se referme plus. L'erreur ne parle pas d'encodage, elle parle d'une parenthèse
# manquante, et elle est passée par là une fois.
#
# Les explications vivent donc dans les commentaires YAML, que GitHub lit en UTF-8 et
# qui n'atteignent jamais PowerShell. Ce qui a du texte à écrire est un script du
# dépôt, qui porte sa marque d'ordre et peut parler français.
#
# ─────────────────────────────────────────────────────────────────────────────
# LES POIDS DE DEMUCS N'Y SONT PAS, ET C'EST DIT
#
# `htdemucs.onnx` pèse 166 Mo, n'est pas dans le dépôt, et ne se refabrique qu'avec
# PyTorch — voir `modele.sh` et `NOTICE.md`. Un coureur ne peut donc pas le produire.
# Le flux le cherche là où il pourrait être : parmi les fichiers déjà attachés à la
# release qu'on construit. S'il l'y trouve, la séparation des pistes part avec
# l'application ; sinon elle en est absente, et les notes de version le disent au
# lieu de laisser le découvrir.

name: Livraison

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Le numéro à poser sur l'essai (rien n'est publié)"
        required: false
        default: "0.0.0"

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Pas de `fail-fast` : si l'ARM64 casse, on veut quand même savoir si le x64
      # passe. Deux échecs disent où est la faute ; un seul ne dit rien.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            # Le nom que swift.org donne à l'architecture n'est pas celui qu'emploie
            # le reste du dépôt : « amd64 » là où l'on écrit « x64 ». D'où cette
            # colonne, plutôt qu'une traduction cachée dans une expression.
            chaine: amd64
          - arch: arm64
            runner: windows-11-arm
            chaine: arm64

    steps:
      - uses: actions/checkout@v4

      # Le couple branche/étiquette se met à jour ensemble : l'action va chercher une
      # archive précise, et une paire dépareillée échoue au téléchargement plutôt
      # qu'à la compilation, ce qui égare. La même version que `verification.yml`.
      #
      # **`build_arch` n'est pas facultatif ici.** Il vaut « amd64 » par défaut, et
      # l'oublier poserait la chaîne x64 sur le coureur ARM : la compilation
      # marcherait — l'émulation est transparente — et l'on livrerait sous le nom
      # « arm64 » un installeur qui ne porte que du x64.
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
          build_arch: ${{ matrix.chaine }}

      - name: Version de la chaîne
        shell: powershell
        run: swift --version

      # L'étiquette est la source : « v0.3 » donne « 0.3 ». Sans étiquette — un essai
      # lancé à la main — on prend ce que la main a dit.
      #
      # La variable est écrite **sans marque d'ordre**, et à la main. `Out-File
      # -Encoding utf8` en pose une sous Windows PowerShell ; ajoutée au milieu du
      # fichier des variables, elle se colle au nom qui suit, la variable s'appelle
      # alors « ﻿VERSION », et elle reste introuvable sans un mot d'erreur.
      - name: Le numéro de version
        shell: powershell
        run: |
          $etiquette = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -eq "tag") { $version = $etiquette -replace '^v', '' }
          else { $version = "${{ inputs.version }}" }
          if (-not $version) { $version = "0.0.0" }
          Write-Host "version : $version"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$version`n",
                                   (New-Object Text.UTF8Encoding($false)))

      # Sans lui, la séparation est **compilée absente** plutôt que d'échouer à
      # l'édition de liens — c'est ce que dit `Package.swift`, et c'est ce qui permet
      # à `verification.yml` de compiler sans télécharger seize mégaoctets. Ici on la
      # veut, donc on l'installe.
      - name: ONNX Runtime
        shell: powershell
        run: .\onnx.ps1 -Arch ${{ matrix.arch }}

      # Cherchés, pas exigés. Voir la note en tête de ce fichier : un coureur ne peut
      # pas fabriquer 166 Mo de réseau entraîné, et l'application sait se passer de
      # lui — elle le dit dans sa barre d'état au lieu de refuser de s'ouvrir.
      - name: Les poids de Demucs, s'ils sont attachés à la release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cible = "Resources\htdemucs.onnx"
          $trouve = $false
          if ("${{ github.ref_type }}" -eq "tag") {
            gh release download "${{ github.ref_name }}" --pattern htdemucs.onnx `
               --output $cible --clobber 2>$null
            $trouve = $LASTEXITCODE -eq 0 -and (Test-Path $cible)
          }
          if ($trouve) {
            Write-Host ("  htdemucs.onnx - {0:N0} Mo" -f ((Get-Item $cible).Length / 1MB))
          } else {
            Write-Host "  (aucun poids attache a la release : la separation sera absente)"
          }

      # Les harnais qui ne demandent ni écran ni carte son. Le rendu, le décodage et
      # la sortie audio sont éprouvés sur la machine de développement et par l'épreuve
      # du dossier propre, plus bas ; un coureur sans carte ni périphérique n'en
      # dirait rien de vrai.
      #
      # `SPECTRE_RANGEMENT` : le cache des pistes séparées a un plafond, et un harnais
      # qui ne range pas chez lui efface les pistes des vrais morceaux. Sans objet sur
      # un coureur neuf, mais c'est en relâchant la discipline « juste ici » qu'on la
      # perd.
      - name: Les harnais hors écran
        shell: powershell
        env:
          SPECTRE_RANGEMENT: ${{ runner.temp }}\spectre
        run: |
          . .\atelier.ps1
          swift build -c release
          if ($LASTEXITCODE -ne 0) { throw "La construction a echoue." }
          $bin = (swift build -c release --show-bin-path | Select-Object -Last 1).Trim()
          foreach ($harnais in @("DSPCheck", "WAVCheck", "SessionCheck", "FilterCheck",
                                 "ChainCheck", "GaplessCheck", "AnalysisCheck",
                                 "PercussionCheck", "HarmonyCheck", "EtirementCheck",
                                 "LangueCheck")) {
            Write-Host "-- $harnais"
            & "$bin\$harnais.exe"
            if ($LASTEXITCODE -ne 0) { throw "$harnais a echoue ($LASTEXITCODE)" }
          }
          # Le rendu, hors ecran : la vraie chaine Direct3D 11 sans fenetre. Il dit
          # si la machine a de quoi dessiner, ce qui est la question que l'epreuve
          # du dossier propre pose ensuite avec une fenetre en plus. Ne fait pas
          # echouer la livraison : un coureur sans carte n'a rien a en dire.
          Write-Host "-- RenduCheck"
          & "$bin\RenduCheck.exe"
          Write-Host "   RenduCheck -> $LASTEXITCODE"

      # `paquet.ps1` refait l'icône avec ce numéro de version, assemble, éprouve le
      # tout dans un dossier propre, puis compile l'installeur et l'archive.
      #
      # `-SansFenetre` : le travail d'un coureur tourne en session 0, sans bureau, et
      # DXGI y meurt d'une violation d'accès en attachant une chaîne d'échange à une
      # fenêtre qui n'est sur aucun écran. Ce n'est pas une panne de Spectre — sur la
      # même machine, `RenduCheck` fait passer toute la chaîne Direct3D hors écran
      # sans broncher, et c'est par là que l'épreuve passe alors. Ce qu'elle est là
      # pour dire, la liste des bibliothèques, se lit tout aussi bien.
      - name: L'installeur et l'archive
        shell: powershell
        env:
          SPECTRE_RANGEMENT: ${{ runner.temp }}\spectre
        run: .\paquet.ps1 -Version $env:VERSION -SansFenetre

      - name: Ce qui a été produit
        shell: powershell
        run: |
          Get-ChildItem build -File |
            Where-Object { $_.Name -like "Spectre-${{ matrix.arch }}*" } |
            ForEach-Object { "{0,-40} {1,8:N1} Mo" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: spectre-${{ matrix.arch }}
          path: |
            build/Spectre-*-installeur.exe
            build/Spectre-*.zip
          if-no-files-found: error

  release:
    name: La release
    needs: windows
    # Seulement sur une étiquette : un essai lancé à la main construit et s'arrête
    # là. C'est ce qui permet d'éprouver ce fichier sans rien publier.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: livraison
          merge-multiple: true

      - name: Ce qui va être attaché
        run: ls -lh livraison/

      - name: Attacher à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiquette="${{ github.ref_name }}"
          version="${etiquette#v}"

          # Les notes sont écrites dans un fichier plutôt que passées en ligne : un
          # document d'entrée dont le délimiteur est indenté ne se ferme pas, et le
          # shell avale alors tout le reste du script sans se plaindre.
          cat > notes.md <<NOTES
          ## Windows

          | fichier | pour |
          |---|---|
          | \`Spectre-x64-installeur.exe\` | PC Intel et AMD |
          | \`Spectre-arm64-installeur.exe\` | PC ARM — Snapdragon X, Surface Pro |

          Windows 10 ou plus récent. L'installeur n'est signé par personne : SmartScreen
          affiche un écran bleu au premier lancement, et il faut passer par
          « Informations complémentaires » puis « Exécuter quand même ».

          Il pose l'application sans demander de droits d'administrateur, l'inscrit au
          menu Démarrer et dans « Applications installées », et propose — case décochée
          — d'ouvrir les fichiers audio avec Spectre. La désinstallation ne laisse rien.

          Les archives \`.zip\` portent la même application sans rien inscrire dans la
          base de registres : le dossier se suffit à lui-même.

          La séparation des pistes n'est pas dans cette livraison — les poids de Demucs
          ne peuvent pas être fabriqués par un coureur, et \`modele.sh\` permet de les
          obtenir directement depuis les serveurs de Meta. Tout le reste est là.
          NOTES

          # `--clobber` remplace un fichier de même nom : ce flux doit pouvoir être
          # relancé sur une étiquette existante sans que la release se retrouve avec
          # deux exemplaires de chaque installeur.
          #
          # La release est créée si elle n'existe pas, et **laissée telle quelle** si
          # elle existe déjà : le paquet macOS y est souvent posé à la main avant, et
          # un flux qui réécrirait les notes de version l'effacerait du même coup.
          if ! gh release view "$etiquette" >/dev/null 2>&1; then
            gh release create "$etiquette" --title "Spectre $version" --notes-file notes.md
          fi

          gh release upload "$etiquette" livraison/* --clobber
