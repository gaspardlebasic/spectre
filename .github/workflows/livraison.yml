# Ce que la livraison fabrique, et où elle le pose.
#
# Cinq coureurs d'un coup : les installeurs Windows (x64 et ARM64), l'archive
# macOS, et les paquets Linux (x86_64 et aarch64, en AppImage et en `.deb`) — puis
# une release qui reçoit ce qu'ils produisent. On pousse une étiquette, et l'affaire
# est faite :
#
#     git tag v0.4 && git push origin v0.4
#
# `workflow_dispatch` fait la même chose sans étiquette, et sans rien publier : c'est
# ainsi qu'on éprouve ce fichier sans salir la page des releases.
#
# ─────────────────────────────────────────────────────────────────────────────
# POURQUOI DEUX COUREURS, ET PAS UNE COMPILATION CROISÉE
#
# Sur le Mac, `livraison.sh` produit **un** binaire qui porte les deux tranches :
# c'est ce que sait faire le format Mach-O, et personne d'autre ne le sait. Un
# exécutable Windows est d'une architecture et d'une seule, si bien qu'il faut deux
# fichiers, deux installeurs, et deux téléchargements distincts.
#
# Compiler l'ARM64 depuis une machine x64 serait possible en principe et personne ne
# l'éprouverait : `build.ps1` finit par lancer l'application dans un dossier propre,
# et ce contrôle-là — le seul qui dise que le paquet s'ouvre chez quelqu'un d'autre —
# ne peut se faire que sur la machine visée. Deux coureurs, donc, et chacun éprouve
# ce qu'il vient de produire. `windows-11-arm` est gratuit pour les dépôts publics.
#
# ─────────────────────────────────────────────────────────────────────────────
# WINDOWS POWERSHELL, ET DES ÉTAPES SANS UN SEUL ACCENT
#
# `shell: powershell` désigne Windows PowerShell 5.1 ; `pwsh`, qui est le défaut de
# GitHub, désigne PowerShell 7. Les scripts du dépôt sont écrits et éprouvés contre
# le premier — `Add-Type -AssemblyName System.Drawing`, dont `logo.ps1` a besoin, ne
# se charge pas de la même manière dans le second.
#
# **Et le corps des étapes ci-dessous ne porte donc aucun caractère accentué.** Le
# coureur écrit chaque `run:` dans un `.ps1` temporaire **sans marque d'ordre**, et
# Windows PowerShell lit alors le fichier dans la page de codes du système : un
# « — » de trois octets en devient trois caractères, et la chaîne qui le contenait ne
# se referme plus. L'erreur ne parle pas d'encodage, elle parle d'une parenthèse
# manquante, et elle est passée par là une fois.
#
# Les explications vivent donc dans les commentaires YAML, que GitHub lit en UTF-8 et
# qui n'atteignent jamais PowerShell. Ce qui a du texte à écrire est un script du
# dépôt, qui porte sa marque d'ordre et peut parler français.
#
# ─────────────────────────────────────────────────────────────────────────────
# LES POIDS DE DEMUCS N'Y SONT PAS, ET C'EST DIT
#
# `htdemucs.onnx` pèse 166 Mo, n'est pas dans le dépôt — GitHub refuse tout fichier
# de plus de 100 Mo — et ne se refabrique qu'avec PyTorch, voir `modele.sh` et
# `NOTICE.md`. Un coureur ne peut donc pas le produire.
#
# Il est attaché à une release qui ne sert qu'à cela, `modele-htdemucs-v4`, et que
# le flux va chercher. L'étiquette qu'on construit peut porter ses propres poids —
# c'est ce qui permettra un jour d'en livrer d'autres — et ceux-là passent d'abord.
# Si rien n'est trouvé, la séparation est simplement absente et les notes de version
# le disent, au lieu de laisser le découvrir.

name: Livraison

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Le numéro à poser sur l'essai (rien n'est publié)"
        required: false
        default: "0.0.0"

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Pas de `fail-fast` : si l'ARM64 casse, on veut quand même savoir si le x64
      # passe. Deux échecs disent où est la faute ; un seul ne dit rien.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            # Le nom que swift.org donne à l'architecture n'est pas celui qu'emploie
            # le reste du dépôt : « amd64 » là où l'on écrit « x64 ». D'où cette
            # colonne, plutôt qu'une traduction cachée dans une expression.
            chaine: amd64
          - arch: arm64
            runner: windows-11-arm
            chaine: arm64

    steps:
      - uses: actions/checkout@v4

      # Le couple branche/étiquette se met à jour ensemble : l'action va chercher une
      # archive précise, et une paire dépareillée échoue au téléchargement plutôt
      # qu'à la compilation, ce qui égare. La même version que `verification.yml`.
      #
      # **`build_arch` n'est pas facultatif ici.** Il vaut « amd64 » par défaut, et
      # l'oublier poserait la chaîne x64 sur le coureur ARM : la compilation
      # marcherait — l'émulation est transparente — et l'on livrerait sous le nom
      # « arm64 » un installeur qui ne porte que du x64.
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
          build_arch: ${{ matrix.chaine }}

      - name: Version de la chaîne
        shell: powershell
        run: swift --version

      # L'étiquette est la source : « v0.3 » donne « 0.3 ». Sans étiquette — un essai
      # lancé à la main — on prend ce que la main a dit.
      #
      # La variable est écrite **sans marque d'ordre**, et à la main. `Out-File
      # -Encoding utf8` en pose une sous Windows PowerShell ; ajoutée au milieu du
      # fichier des variables, elle se colle au nom qui suit, la variable s'appelle
      # alors « ﻿VERSION », et elle reste introuvable sans un mot d'erreur.
      - name: Le numéro de version
        shell: powershell
        run: |
          $etiquette = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -eq "tag") { $version = $etiquette -replace '^v', '' }
          else { $version = "${{ inputs.version }}" }
          if (-not $version) { $version = "0.0.0" }
          Write-Host "version : $version"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$version`n",
                                   (New-Object Text.UTF8Encoding($false)))

      # Sans lui, la séparation est **compilée absente** plutôt que d'échouer à
      # l'édition de liens — c'est ce que dit `Package.swift`, et c'est ce qui permet
      # à `verification.yml` de compiler sans télécharger seize mégaoctets. Ici on la
      # veut, donc on l'installe.
      - name: ONNX Runtime
        shell: powershell
        run: .\onnx.ps1 -Arch ${{ matrix.arch }}

      # Cherchés, pas exigés. Voir la note en tête de ce fichier : un coureur ne peut
      # pas fabriquer 166 Mo de réseau entraîné, et l'application sait se passer de
      # lui — elle le dit dans sa barre d'état au lieu de refuser de s'ouvrir.
      - name: Les poids de Demucs, s'ils sont attachés à la release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # « Continue », et c'est indispensable : GitHub pose « Stop », et PowerShell
          # tient alors pour une erreur fatale tout ce qu'un exécutable ecrit sur sa
          # sortie d'erreur — meme redirigee. `gh release download` dit « release not
          # found » quand la release n'existe pas encore, ce qui est le cas normal
          # d'une premiere livraison, et l'etape entiere s'arretait dessus. Le meme
          # piege est decrit en tete d'`essai.ps1`.
          $ErrorActionPreference = "Continue"
          $cible = "Resources\htdemucs.onnx"
          $trouve = $false
          # D'abord l'etiquette qu'on construit : y attacher ses propres poids reste
          # possible, et c'est ce qui permettra un jour d'en livrer d'autres.
          if ("${{ github.ref_type }}" -eq "tag") {
            gh release download "${{ github.ref_name }}" --pattern htdemucs.onnx `
               --output $cible --clobber 2>$null
            $trouve = $LASTEXITCODE -eq 0 -and (Test-Path $cible)
          }
          # Sinon la release qui ne sert qu'a cela. Elle ne bouge pas, elle n'est pas
          # une version de Spectre, et c'est la reponse a une contrainte de GitHub :
          # 166 Mo ne peuvent pas etre pousses dans un depot, la limite etant de 100.
          if (-not $trouve) {
            gh release download "modele-htdemucs-v4" --pattern htdemucs.onnx `
               --output $cible --clobber 2>$null
            $trouve = $LASTEXITCODE -eq 0 -and (Test-Path $cible)
          }
          if ($trouve) {
            Write-Host ("  htdemucs.onnx - {0:N0} Mo" -f ((Get-Item $cible).Length / 1MB))
          } else {
            Write-Host "  (aucun poids trouve : la separation sera absente)"
          }
          # Le coureur termine chaque etape par `exit $LASTEXITCODE`, qui porte encore
          # le 1 du `gh` ci-dessus. Sans cette ligne, l'etape echoue apres avoir dit
          # que tout allait bien.
          exit 0

      # Les harnais qui ne demandent ni écran ni carte son. Le rendu, le décodage et
      # la sortie audio sont éprouvés sur la machine de développement et par l'épreuve
      # du dossier propre, plus bas ; un coureur sans carte ni périphérique n'en
      # dirait rien de vrai.
      #
      # `SPECTRE_RANGEMENT` : le cache des pistes séparées a un plafond, et un harnais
      # qui ne range pas chez lui efface les pistes des vrais morceaux. Sans objet sur
      # un coureur neuf, mais c'est en relâchant la discipline « juste ici » qu'on la
      # perd.
      - name: Les harnais hors écran
        shell: powershell
        env:
          SPECTRE_RANGEMENT: ${{ runner.temp }}\spectre
        run: |
          . .\atelier.ps1
          swift build -c release
          if ($LASTEXITCODE -ne 0) { throw "La construction a echoue." }
          $bin = (swift build -c release --show-bin-path | Select-Object -Last 1).Trim()
          foreach ($harnais in @("JournalCheck", "RapportsCheck", "DSPCheck", "WAVCheck",
                                 "SessionCheck", "FilterCheck",
                                 "ChainCheck", "GaplessCheck", "AnalysisCheck",
                                 "PercussionCheck", "HarmonyCheck", "EtirementCheck",
                                 "LangueCheck")) {
            Write-Host "-- $harnais"
            & "$bin\$harnais.exe"
            if ($LASTEXITCODE -ne 0) { throw "$harnais a echoue ($LASTEXITCODE)" }
          }
          # Le rendu, hors ecran : la vraie chaine Direct3D 11 sans fenetre. Il dit
          # si la machine a de quoi dessiner, ce qui est la question que l'epreuve
          # du dossier propre pose ensuite avec une fenetre en plus. Ne fait pas
          # echouer la livraison : un coureur sans carte n'a rien a en dire.
          Write-Host "-- RenduCheck"
          & "$bin\RenduCheck.exe"
          Write-Host "   RenduCheck -> $LASTEXITCODE"
          # Meme raison que dans l'etape des poids : le coureur termine l'etape par
          # `exit $LASTEXITCODE`, et celui de RenduCheck ne doit pas faire echouer la
          # livraison. Les vrais echecs, au-dessus, passent par `throw`.
          exit 0

      # `paquet.ps1` refait l'icône avec ce numéro de version, assemble, éprouve le
      # tout dans un dossier propre, puis compile l'installeur et l'archive.
      #
      # `-SansFenetre` : le travail d'un coureur tourne en session 0, sans bureau, et
      # DXGI y meurt d'une violation d'accès en attachant une chaîne d'échange à une
      # fenêtre qui n'est sur aucun écran. Ce n'est pas une panne de Spectre — sur la
      # même machine, `RenduCheck` fait passer toute la chaîne Direct3D hors écran
      # sans broncher, et c'est par là que l'épreuve passe alors. Ce qu'elle est là
      # pour dire, la liste des bibliothèques, se lit tout aussi bien.
      - name: L'installeur et l'archive
        shell: powershell
        env:
          SPECTRE_RANGEMENT: ${{ runner.temp }}\spectre
        run: .\paquet.ps1 -Version $env:VERSION -SansFenetre

      - name: Ce qui a été produit
        shell: powershell
        run: |
          Get-ChildItem build -File |
            Where-Object { $_.Name -like "Spectre-${{ matrix.arch }}*" } |
            ForEach-Object { "{0,-40} {1,8:N1} Mo" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: spectre-${{ matrix.arch }}
          path: |
            build/Spectre-*-installeur.exe
            build/Spectre-*.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    # Deux coureurs, pour la même raison que sous Windows : un exécutable Linux est
    # d'une architecture et d'une seule, et chacun éprouve ce qu'il vient de produire.
    #
    # Ce travail n'en a longtemps eu qu'un, et le commentaire qui l'expliquait portait
    # « GitHub n'offre pas de coureur Linux ARM64 gratuit ». **C'était faux depuis
    # janvier 2025** : `ubuntu-22.04-arm` et `ubuntu-24.04-arm` sont gratuits pour les
    # dépôts publics, et généralement disponibles depuis août 2025 — la même annonce
    # que `windows-11-arm`, dont ce fichier se sert deux travaux plus haut. Une
    # impossibilité affirmée trois fois dans le dépôt était une simple ligne à écrire,
    # et personne n'était allé regarder.
    #
    # Ce n'est pas une commodité : la machine d'essai Linux du projet **est** en
    # aarch64, si bien que la seule machine où l'on regardait vraiment le paquet Linux
    # était celle qui ne pouvait pas l'ouvrir. Voir `docs/PAQUETS.md`.
    strategy:
      # Comme sous Windows : si l'ARM64 casse, on veut quand même savoir si le x86_64
      # passe. Deux échecs disent où est la faute ; un seul ne dit rien.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            # `onnx.sh` va chercher les archives d'ONNX Runtime, qui disent « x64 » et
            # « arm64 » là où AppImage dit « x86_64 » et « aarch64 ». D'où cette
            # colonne, plutôt qu'une traduction cachée dans une expression — même
            # choix que la colonne `chaine` du travail Windows.
            tranche: x64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            tranche: arm64
    runs-on: ${{ matrix.runner }}
    # `-jammy` : Ubuntu 22.04, et c'est le choix qui décide de tout. Un AppImage
    # construit contre une glibc récente ne s'ouvre pas sur une distribution plus
    # ancienne, tandis que l'inverse marche toujours — on construit donc contre la
    # plus vieille glibc qu'on veuille servir. La version de Swift, elle, reste celle
    # des deux autres chaînes : un portage se juge sur un désaccord de plateforme,
    # pas de compilateur.
    container: swift:6.3-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Version de la chaîne
        run: swift --version

      - name: Les bibliothèques
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            file \
            libcairo2-dev libpango1.0-dev libasound2-dev \
            libsndfile1-dev libmpg123-dev libepoxy-dev libgl1-mesa-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libdecor-0-plugin-1-cairo \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev

      - name: SDL3
        run: |
          git clone --depth 1 --branch release-3.4.14 \
            https://github.com/libsdl-org/SDL /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DSDL_SHARED=ON
          cmake --build /tmp/SDL/build
          cmake --install /tmp/SDL/build
          ldconfig

      # Sans lui, la séparation est **compilée absente** plutôt que d'échouer à
      # l'édition de liens. Ici on la veut, donc on l'installe — le jumeau exact de
      # ce que fait la chaîne Windows deux travaux plus haut.
      - name: ONNX Runtime
        run: ./onnx.sh --arch ${{ matrix.tranche }}

      # Cherchés, pas exigés — même règle que sous Windows : un coureur ne peut pas
      # fabriquer 166 Mo de réseau entraîné, et l'application sait se passer de lui.
      #
      # `curl` et non `gh` : ce job tourne dans un conteneur `swift:6.3-jammy`, où
      # `gh` n'est pas installé — les deux autres coureurs l'ont préinstallé, pas le
      # conteneur. « poids absents » ci-dessous a déjà été imprimé une fois, et c'est
      # ainsi qu'on l'a découvert. Le lien direct d'une release publique n'a besoin
      # d'aucune main ni d'aucun jeton.
      - name: Les poids de Demucs
        run: |
          mkdir -p Resources
          curl -sL -o Resources/htdemucs.onnx \
            "https://github.com/gaspardlebasic/spectre/releases/download/modele-htdemucs-v4/htdemucs.onnx" \
            && ls -lh Resources/htdemucs.onnx \
            || echo "poids absents — la séparation s'annoncera absente"

      - name: Les harnais hors écran
        env:
          SPECTRE_RANGEMENT: ${{ runner.temp }}/spectre
        run: |
          swift build -c release
          BIN="$(swift build -c release --show-bin-path)"
          # Les poids, à côté des harnais. `Reseau.fichier` les cherche d'abord auprès
          # de l'exécutable, et sans cette ligne `PistesCheck` imprime « réseau absent,
          # séparation sautée » puis passe au vert : le seul contrôle qui fasse tourner
          # Demucs pour de vrai est **sauté depuis toujours** sur ce coureur, alors même
          # que l'étape précédente vient de télécharger les 166 Mo. Un contrôle qui se
          # saute sans le faire remarquer ne vaut pas mieux que pas de contrôle — et
          # c'est ce qui rendait invérifiable la seule question que pose l'arrivée du
          # coureur ARM64 : est-ce que la séparation marche là aussi ?
          cp -f Resources/htdemucs.onnx "$BIN/" 2>/dev/null || true
          for harnais in LangueCheck JournalCheck RapportsCheck DSPCheck WAVCheck SessionCheck FilterCheck \
                         ChainCheck GaplessCheck AnalysisCheck PercussionCheck \
                         HarmonyCheck GestesCheck DecodeCheck PistesCheck; do
            echo "── $harnais"
            "$BIN/$harnais"
          done

      # L'AppImage **et** le paquet Debian, assemblés depuis le même AppDir : voir la
      # note en tête de `paquet.sh`. `dpkg-deb` est là parce que `build-essential`,
      # installé plus haut, tire `dpkg-dev` — le second paquet ne coûte donc rien de
      # plus au coureur que les quelques secondes de sa compression.
      - name: Les paquets
        env:
          SPECTRE_RANGEMENT: ${{ runner.temp }}/spectre
        run: |
          # Sur une étiquette, le numéro vient d'elle et `paquet.sh` vérifie qu'il
          # s'accorde au code. Sur un essai — `workflow_dispatch` — il n'y a pas
          # d'étiquette, et « deb-en-ci » n'est pas un numéro de version : le paquet
          # refusait alors de se fabriquer, ce qui rendait inutilisable la porte de
          # secours que ce fichier annonce en tête. On laisse donc `paquet.sh`
          # prendre le numéro du code, qui est le seul endroit où il s'écrit.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ./paquet.sh --version "${GITHUB_REF_NAME#v}"
          else
            ./paquet.sh
          fi

      - name: Ce qui a été produit
        run: ls -lh build/Spectre-*.AppImage build/Spectre-*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: spectre-linux-${{ matrix.arch }}
          path: |
            build/Spectre-*.AppImage
            build/Spectre-*.deb
          if-no-files-found: error

  macos:
    name: macOS — l'application
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Version de la chaîne
        run: swift --version

      # Cherchés, parce qu'un coureur ne peut pas fabriquer 166 Mo de réseau
      # entraîné — même règle que sous Windows et sous Linux. Mais `livraison.sh`,
      # lui, les **exige** : il refuse d'assembler l'archive sans eux. C'est cette
      # exigence qui garantit que ce qui part contient la séparation.
      - name: Les poids de Demucs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Resources
          gh release download modele-htdemucs-v4 --pattern htdemucs.onnx \
            --dir Resources --clobber 2>/dev/null || true
          ls -lh Resources/
          [ -f Resources/htdemucs.onnx ] || echo "poids absents — la livraison échouera"

      - name: Les harnais hors écran
        run: ./check.sh

      - name: L'épreuve sans la fenêtre
        # Le morceau témoin et ce qu'on en tire sans écran ; un coureur n'a pas de
        # session graphique. L'application elle-même se juge à la main, sur
        # `build/essai/fenetre.png`. `--rapide` évite de repasser les harnais que
        # l'étape précédente vient de faire tourner.
        run: ./essai.sh --rapide --sans-fenetre

      # `livraison.sh` compile les deux tranches en un exécutable, y embarque les
      # poids, zippe le paquet avec `ditto` (seul à garder la signature), puis rouvre
      # l'archive ailleurs et y lance chaque tranche sur un morceau : l'épreuve du
      # dossier propre, côté macOS. Il échoue si les poids manquent.
      - name: L'installeur
        env:
          SPECTRE_RANGEMENT: ${{ runner.temp }}/spectre
        run: ./livraison.sh

      - name: Ce qui a été produit
        run: ls -lh build/Spectre.zip

      - uses: actions/upload-artifact@v4
        with:
          name: spectre-macos
          path: build/Spectre.zip
          if-no-files-found: error

  release:
    name: La release
    needs: [windows, linux, macos]
    # Seulement sur une étiquette : un essai lancé à la main construit et s'arrête
    # là. C'est ce qui permet d'éprouver ce fichier sans rien publier.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: livraison
          merge-multiple: true

      - name: Ce qui va être attaché
        run: ls -lh livraison/

      - name: Attacher à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiquette="${{ github.ref_name }}"
          version="${etiquette#v}"

          # Les notes sont écrites dans un fichier plutôt que passées en ligne : un
          # document d'entrée dont le délimiteur est indenté ne se ferme pas, et le
          # shell avale alors tout le reste du script sans se plaindre.
          cat > notes.md <<NOTES
          ## Ce qui change

          **La présentation du premier lancement se referme.** Sous Windows et sous
          Linux, « Suivant » et « Passer » ne faisaient rien : le clic arrivait bien,
          et il était jeté avant d'être lu. On était donc accueilli par une modale
          qu'on ne pouvait chasser qu'au clavier, la première fois qu'on ouvrait
          l'application. C'est réparé, et c'est la raison de cette livraison.

          **Une version proposée peut être écartée pour de bon.** « Plus tard » ne
          valait que pour la séance en cours — la question revenait à chaque
          ouverture, et rien ne la faisait taire. « Ignorer cette version » la
          remplace : ce numéro-là ne sera plus proposé. La livraison d'après reposera
          la question une fois, car on écarte une version, pas les mises à jour.

          ## macOS

          \`Spectre.zip\` — l'application, pour Mac Apple Silicon **et** Mac Intel
          (un seul fichier, les deux tranches). macOS 15 ou plus récent.

          Elle n'est pas signée par un identifiant Apple : macOS la met en quarantaine
          au téléchargement. Une fois glissée dans Applications :

          \`\`\`
          xattr -dr com.apple.quarantine /Applications/Spectre.app
          \`\`\`

          ## Windows

          | fichier | pour |
          |---|---|
          | \`Spectre-x64-installeur.exe\` | PC Intel et AMD |
          | \`Spectre-arm64-installeur.exe\` | PC ARM — Snapdragon X, Surface Pro |

          Windows 10 ou plus récent. L'installeur n'est signé par personne : SmartScreen
          affiche un écran bleu au premier lancement, et il faut passer par
          « Informations complémentaires » puis « Exécuter quand même ».

          Il pose l'application sans demander de droits d'administrateur, l'inscrit au
          menu Démarrer et dans « Applications installées », et propose — case décochée
          — d'ouvrir les fichiers audio avec Spectre. La désinstallation ne laisse rien.

          Les archives \`.zip\` portent la même application sans rien inscrire dans la
          base de registres : le dossier se suffit à lui-même.

          La séparation des pistes est dans cette livraison : les poids de Demucs v4 y
          sont embarqués. **Ils ne sont pas sous GPL et ne sont pas licenciés par
          l'auteur de Spectre** — leur auteur les réserve à un usage scientifique, voir
          [NOTICE.md](https://github.com/gaspardlebasic/spectre/blob/main/NOTICE.md).
          \`modele.sh\` permet de les obtenir directement depuis les serveurs de Meta.

          ## Linux

          Sur Ubuntu et Debian, prendre le \`.deb\` : c'est le seul des deux qui
          s'installe vraiment d'un double-clic, qui met Spectre au menu, et qui fait
          qu'un double-clic sur un fichier audio ouvre Spectre.

          | fichier | pour |
          |---|---|
          | \`Spectre-amd64.deb\` | Ubuntu et Debian, PC Intel et AMD |
          | \`Spectre-arm64.deb\` | Ubuntu et Debian, machines ARM |
          | \`Spectre-x86_64.AppImage\` | toutes les autres distributions, Intel et AMD |
          | \`Spectre-aarch64.AppImage\` | toutes les autres distributions, ARM |

          \`\`\`
          sudo apt install ./Spectre-amd64.deb
          \`\`\`

          L'AppImage, lui, ne s'installe pas : \`chmod +x Spectre-x86_64.AppImage\` puis
          on le lance.

          **Ce \`chmod\` n'est pas facultatif, et l'oublier ne dit rien.** Tout
          navigateur retire le bit d'exécution au téléchargement. Un double-clic
          proposera alors d'ouvrir le fichier avec « Disk Image Mounter », ou ne fera
          rien du tout — un AppImage est une image disque tant qu'il n'est pas
          exécutable, et le bureau ne voit que l'image. C'est la raison d'être du
          \`.deb\`, qui n'a pas ce défaut.

          Les deux portent exactement la même application, assemblée une seule fois :
          SDL3, Cairo, Pango, la bibliothèque standard de Swift, et ce qui doit venir
          du système en vient — les pilotes graphiques et le son. Il faut une carte
          qui sache OpenGL 3.3, et Wayland ou X11.

          **Pas sur un Raspberry Pi.** Les paquets ARM s'y installent, mais
          l'application ne s'y ouvre pas : le pilote `v3d` d'un Pi 4 ou d'un Pi 5
          s'arrête à OpenGL 3.1. Ils visent les machines ARM munies d'un pilote
          OpenGL complet — serveurs, machines virtuelles ARM64, portables sous ARM.

          Le fichier \`.desktop\` embarqué dans l'AppImage met Spectre au menu et dans
          le « Ouvrir avec » des fichiers audio, mais seulement si l'on utilise
          \`AppImageLauncher\` ou \`appimaged\` ; le \`.deb\` le fait tout seul.

          La séparation des pistes est dans cette livraison : les poids de Demucs v4
          y sont embarqués. **Ils ne sont pas sous GPL et ne sont pas licenciés par
          l'auteur de Spectre** — leur auteur les réserve à un usage scientifique, voir
          [NOTICE.md](https://github.com/gaspardlebasic/spectre/blob/main/NOTICE.md).
          NOTES

          # `--clobber` remplace un fichier de même nom : ce flux doit pouvoir être
          # relancé sur une étiquette existante sans que la release se retrouve avec
          # deux exemplaires de chaque installeur.
          #
          # La release est créée si elle n'existe pas, et **laissée telle quelle** si
          # elle existe déjà : quelqu'un a pu y poser quelque chose à la main — un
          # AppImage ARM, un paquet d'essai — et un flux qui réécrirait les notes de
          # version l'effacerait du même coup.
          if ! gh release view "$etiquette" >/dev/null 2>&1; then
            gh release create "$etiquette" --title "Spectre $version" --notes-file notes.md
          fi

          gh release upload "$etiquette" livraison/* --clobber
